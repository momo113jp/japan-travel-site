<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>東京出勤女孩</title>

    <meta name="description"
          content="東京旅遊攻略，整理新宿、澀谷、池袋、六本木等熱門地區的交通、住宿、景點與自由行資訊。">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            color: #514147;

            background: #fffafb;

            line-height: 1.8;
        }

        header {
            background: white;

            border-bottom:
                1px solid #f1dce2;

            padding: 20px 6%;

            display: flex;

            justify-content:
                space-between;

            align-items: center;
        }

        header a {
            color: #b85c72;

            text-decoration: none;

            font-size: 14px;
        }

        .hero {

            background:
                linear-gradient(
                    135deg,
                    #e9a8b6,
                    #d98b9b,
                    #c9788d
                );

            color: white;

            padding:
                75px 8%;
        }

        .hero small {

            letter-spacing: 4px;

            color: #fff0f3;
        }

        .hero h1 {

            font-size: 48px;

            margin:
                15px 0;
        }

        main {

            max-width: 1050px;

            margin:
                60px auto;

            padding:
                0 25px;
        }

        .intro {

            background: white;

            border:
                1px solid #f0dce1;

            padding: 30px;

            border-radius: 10px;

            margin-bottom: 50px;
        }

        .areas {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;
        }

        .area {

            background: white;

            border:
                1px solid #f0dce1;

            padding: 30px;

            border-radius: 10px;

            transition: 0.2s;
        }

        .area:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 10px 25px
                rgba(190, 100, 125, 0.12);
        }

        .area h2 {

            color: #a64f66;

            margin-top: 0;
        }

        .area a {

            color: #c26379;

            text-decoration: none;

            font-size: 14px;
        }

        footer {

            background: #4a363d;

            color: white;

            text-align: center;

            padding: 30px;
        }

        @media(max-width:700px) {

            .areas {

                grid-template-columns:
                    1fr;
            }

            .hero h1 {

                font-size: 36px;
            }

        }

    </style>

</head>

<body>
    
<img src="tokyo-01.jpg"
     alt="東京女孩出勤"
     class="main-photo">

<header>

    <strong>
       東京女孩出勤
    </strong>

    <a href="index.html">
        ← 回到首頁
    </a>

</header>


<section class="hero">

    <small>
        Tokyo Girls on Duty
    </small>

    <h1>
        東京女孩出勤
    </h1>

    <p>
        東京女孩出勤資訊
    </p>

</section>


<main>


    <section class="intro">

        <h2>
            東京女孩出勤
        </h2>

        <p>

            東京是日本最熱門的旅遊城市之一。
            第一次前往東京體驗外送服務，
            可以在此查看當日出勤的女生
        </p>

        <p>

            以下整理東京出勤女生，
            方便查看~

        </p>

    </section>


    <section>

        <div class="areas">


            <div class="area">

                <h2>
                    新宿
                </h2>

                <p>

                    東京重要的商業與交通中心，
                    周邊有大型商場、餐廳與住宿選擇。

                </p>

                <a href="#">
                    新宿旅遊攻略 →
                </a>

            </div>


<footer>

    東京外送茶

    <br>

    東京・大阪外送茶

</footer>


</body>

</html>
