<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>東京女生出勤</title>

<meta name="description"
      content="東京女生出勤，整理東京出勤女生的資訊。">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: #fffafb;

    color: #514147;

    font-family:
        Arial,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}


/* Header */

header {

    height: 72px;

    background: #ffffff;

    border-bottom:
        1px solid #f0dce1;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 6%;
}

.logo {

    color: #9c4f65;

    font-weight: bold;

    font-size: 16px;
}

header a {

    color: #8f6570;

    text-decoration: none;

    font-size: 13px;
}


/* Hero */

.hero {

    background:
        linear-gradient(
            135deg,
            #e9a8b6,
            #d98b9b,
            #c9788d
        );

    color: white;

    padding: 70px 8%;
}

.hero small {

    letter-spacing: 4px;

    font-size: 11px;

    color: #fff1f4;
}

.hero h1 {

    margin: 15px 0 10px;

    font-size: 45px;
}

.hero p {

    margin: 0;

    color: #fff3f5;
}


/* Main */

main {

    max-width: 1100px;

    margin: 60px auto;

    padding: 0 25px;
}


/* Section */

.section-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 25px;
}

.section-head h2 {

    margin: 0;

    font-size: 28px;

    color: #513b42;
}

.section-head span {

    color: #b28a94;

    font-size: 13px;
}


/* Cards */

.cards {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}


.card {

    background: white;

    border:
        1px solid #efdde2;

    overflow: hidden;

    border-radius: 8px;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.card:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 12px 30px
        rgba(190,100,125,.12);
}


/* Image */

.card-image {

    width: 100%;

    height: 310px;

    object-fit: cover;

    display: block;
}


/* Card info */

.card-info {

    padding: 20px;
}

.card-info h3 {

    margin: 0 0 8px;

    color: #8f4058;

    font-size: 20px;
}

.card-info p {

    margin: 5px 0;

    color: #75656a;

    font-size: 13px;
}

.card-info a {

    display: inline-block;

    margin-top: 12px;

    color: #c26379;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;
}


/* Tag */

.tag {

    display: inline-block;

    background: #f8e7eb;

    color: #a65368;

    padding: 4px 10px;

    border-radius: 20px;

    font-size: 11px;

    margin-bottom: 10px;
}


/* Footer */

footer {

    margin-top: 80px;

    background: #4a363d;

    color: white;

    padding: 35px;

    text-align: center;
}

footer p {

    color: #dbcbd0;

    font-size: 12px;
}


/* Mobile */

@media (max-width: 700px) {

    header {

        padding:
            0 20px;
    }

    .hero {

        padding:
            55px 25px;
    }

    .hero h1 {

        font-size: 35px;
    }

    .cards {

        grid-template-columns:
            1fr;
    }

    .card-image {

        height: 360px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        東京女生出勤
    </div>

    <a href="index.html">
        ← 回首頁
    </a>

</header>


<section class="hero">

    <small>
        TOKYO PEOPLE
    </small>

    <h1>
        東京女生出勤
    </h1>

    <p>
        東京女生出勤介紹
    </p>

</section>


<main>


<section>

    <div class="section-head">

        <h2>
            東京女生出勤
        </h2>

        <span>
            6 個介紹
        </span>

    </div>


    <div class="cards">


        <!-- 第一張 -->

        <div class="card">

            <img
                src="tokyo outcall1.jpg"
                alt="東京女生照片"
                class="card-image">

            <div class="card-info">

                <span class="tag">
                    東京
                </span>

                <h3>
                    杏奈（Anna）
                </h3>

                <p>
                    158cm/Bcup/40kg/24岁
                </p>

                <p>
                    可接待外国人
                </p>

                <a href="#">
                    查看詳細介紹 →
                </a>

            </div>

        </div>


        <!-- 第二張 -->

        <div class="card">

            <img
                src="Tokyo-outcall2.jpg"
                alt="東京女生照片"
                class="card-image">

            <div class="card-info">

                <span class="tag">
                    東京
                </span>

                <h3>
                    結花（Yuika）
                </h3>

                <p>
                    160cm/Ecup/46kg/24岁
                </p>

                <p>
                    可接待外国人
                </p>

                <a href="#">
                    查看詳細介紹 →
                </a>

            </div>

        </div>


        <!-- 第三張 -->

        <div class="card">

            <img
                src="images/tokyo-03.jpg"
                alt="東京人物照片"
                class="card-image">

            <div class="card-info">

                <span class="tag">
                    東京
                </span>

                <h3>
                    小奈
                </h3>

                <p>
                    東京地區人物介紹
                </p>

                <p>
                    東京生活・旅遊資訊
                </p>

                <a href="#">
                    查看詳細介紹 →
                </a>

            </div>

        </div>


    </div>

</section>


</main>


<footer>

    <strong>
        東京女生出勤
    </strong>

    <p>
        東京・大阪外送茶
    </p>

</footer>


</body>

</html>
