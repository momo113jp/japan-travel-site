<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>杏奈（Anna）｜東京女生出勤資訊</title>

<meta name="description"
      content="小櫻東京人物介紹與基本資料。">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fffafb;
    color: #514147;
    font-family:
        Arial,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}


/* 頂部 */

header {
    height: 72px;
    background: #ffffff;
    border-bottom: 1px solid #f0dce1;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;
}

.logo {
    color: #9c4f65;
    font-weight: bold;
    font-size: 16px;
}

.back {
    color: #9c4f65;
    text-decoration: none;
    font-size: 13px;
}


/* 內容 */

main {
    max-width: 1050px;
    margin: 50px auto;
    padding: 0 25px;
}


/* 詳細資料 */

.profile {

    background: #ffffff;

    border: 1px solid #efdde2;

    display: grid;

    grid-template-columns: 42% 58%;

    overflow: hidden;

    border-radius: 8px;
}


/* 左邊照片 */

.profile-image img {

    width: 100%;

    height: 620px;

    object-fit: contain;

    display: block;

    background: #f5eeee;
}


/* 右邊資料 */

.profile-info {

    padding: 55px 50px;
}

.label {

    color: #bd6278;

    font-size: 11px;

    letter-spacing: 3px;

    text-transform: uppercase;
}

.profile-info h1 {

    font-size: 42px;

    margin: 15px 0 30px;

    color: #4b3940;
}


/* 基本資料 */

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

    padding:
        25px 0;

    border-top:
        1px solid #eadde0;

    border-bottom:
        1px solid #eadde0;
}

.info-item span {

    display: block;

    font-size: 11px;

    color: #a58c94;

    margin-bottom: 7px;
}

.info-item strong {

    font-size: 15px;

    color: #574249;
}


/* 介紹 */

.introduction {

    margin-top: 30px;
}

.introduction h2 {

    font-size: 20px;

    color: #8f4058;

    margin-bottom: 15px;
}

.introduction p {

    color: #75656a;

    font-size: 14px;

    line-height: 2;
}


/* 返回 */

.return-list {

    display: inline-block;

    margin-bottom: 25px;

    color: #a65368;

    text-decoration: none;

    font-size: 13px;
}


/* Footer */

footer {

    margin-top: 80px;

    background: #4a363d;

    color: white;

    padding: 35px;

    text-align: center;
}

footer p {

    color: #dbcbd0;

    font-size: 12px;
}


/* 手機版 */

@media (max-width: 700px) {

    .profile {
        grid-template-columns: 1fr;
    }

    .profile-image img {
        width: 100%;
        height: auto;
        max-height: none;
        object-fit: contain;
    }

    .profile-info {
        padding: 35px 25px;
    }

    .profile-info h1 {
        font-size: 34px;
    }

    .info-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

</style>

</head>


<body>


<header>

    <div class="logo">
        東京女生出勤
    </div>

    <a
        class="back"
        href="tokyo.html">
        ← 返回東京女生出勤
    </a>

</header>


<main>


<a
    class="return-list"
    href="tokyo.html">
    ← 返回列表
</a>


<div class="profile">


    <!-- 左邊照片 -->

    <div class="profile-image">

        <img
            src="tokyo outcall1.jpg"
            alt="杏奈（Anna）">

    </div>


    <!-- 右邊資料 -->

    <div class="profile-info">

        <div class="label">
            TOKYO · PROFILE
        </div>


        <h1>
            杏奈（Anna）
        </h1>


        <div class="info-grid">


            <div class="info-item">

                <span>
                    Age
                </span>

                <strong>
                    24 
                </strong>

            </div>


            <div class="info-item">

                <span>
                    Height
                </span>

                <strong>
                    158 cm
                </strong>

            </div>


            <div class="info-item">

                <span>
                    地區
                </span>

                <strong>
                    東京
                </strong>

            </div>


        </div>


        <div class="introduction">

            <h2>
                人物介紹
            </h2>

            <p>
                價格：57000/小時/次
                接待：可接待外国人
            </p>

        </div>


    </div>


</div>


</main>


<footer>

    <strong>
        東京女生出勤
    </strong>

    <p>
        東京・大阪外送茶
    </p>

</footer>


</body>

</html>
